# Render blueprint for the PoshanNetra API (master prompt, Section 13).
#
# Only the backend lives here. The three frontends deploy to Vercel and the
# database and photo storage to Supabase, which is Section 13's split and the
# reason this file declares no database of its own: Render's free Postgres
# expires after 30 days, and Supabase additionally provides the Storage bucket
# and the row-level security this system's whole authorisation model rests on.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.
# Then fill the secrets marked `sync: false` in the dashboard; they are
# deliberately not in this file.

services:
  - type: web
    name: poshannetra-api
    runtime: python
    plan: free
    # Singapore is the closest region Render offers; it has none in India.
    # A service's region is fixed at creation -- changing this line does not
    # move an existing service, it only applies to a newly created one. See
    # docs/region-migration.md.
    #
    # Note for legal review: the API compute runs here, but no data rests here.
    # Every row lives in Supabase (Mumbai, ap-south-1); this service holds
    # nothing between requests. Verify with GET /health/db, which reports the
    # database region.
    region: singapore
    rootDir: backend
    branch: master

    buildCommand: pip install --upgrade pip && pip install -e .

    # Migrations run at startup rather than as a preDeployCommand, because
    # Render's free tier does not support pre-deploy commands.
    #
    # The wrapper exists because a blueprint deploys the moment it creates the
    # service -- before anyone can fill the `sync: false` secrets below. Without
    # it that first deploy dies inside Alembic and the dashboard shows only
    # "failed"; with it, the log says which variables are missing and where to
    # get them.
    startCommand: ./scripts/start.sh

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"

      # "demo" is as hardened as production -- no debug codes, explicit CORS --
      # but permits seeding, which Section 14 step 1 asks for. Change to
      # "production" once real data is involved, and the seed script will then
      # refuse to run.
      - key: APP_ENV
        value: demo
      - key: LOG_LEVEL
        value: INFO

      # Every frontend origin, comma separated. Empty means CORS blocks all
      # three apps, so this is not optional.
      - key: ALLOWED_ORIGINS
        sync: false

      # Supabase: session pooler URI (port 5432, not the transaction pooler),
      # rewritten to postgresql+asyncpg://. See docs/phase1-supabase-setup.md.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: plate-photos
      - key: STORAGE_MODE
        value: rls

      # Section 11's short-lived access token; the 30-day refresh token is what
      # lets the Field PWA survive days offline (Section 7).
      - key: JWT_TTL_SECONDS
        value: "3600"
      - key: REFRESH_TTL_DAYS
        value: "30"

      # Sign-in delivery. "console" logs the code instead of sending it, which
      # is right for a demo with no SMS credits; switch to msg91 and fill the
      # three keys below once a DLT template is approved.
      - key: OTP_PROVIDER
        value: console

      # Returns the one-time code in the response for the seeded 99999xxxxx
      # numbers, so a reviewer can sign in without SMS credits or reading logs.
      #
      # This is an open door and is meant to be: anyone with the URL can sign
      # in as any seeded account. Only ever set it while the database holds
      # nothing but synthetic data. Setting APP_ENV=production disables it
      # regardless of this value.
      - key: DEMO_REVEAL_OTP
        value: "true"
      - key: MSG91_AUTHKEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER
        sync: false

      # Section 4's zero-paid-API constraint. "mock" spends nothing; set to
      # gemini and supply a free-tier key to run real recognition.
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
